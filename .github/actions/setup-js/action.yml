name: Set up JS deps
description: >
  Sets up Node.js with npm cache reuse and installs JS dependencies via
  `npm ci`. Assumes the repo is already checked out. Shared by ci.yml,
  cd.yml and codeql.yml — every job needs this regardless of platform or
  build variant (debug/release).

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: npm

    - name: Install JS dependencies
      shell: bash
      run: npm ci
