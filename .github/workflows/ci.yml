name: CI

# Build every platform on every push/PR to main so regressions are caught
# before merge, plus a manual trigger for ad-hoc builds. These are release
# *configuration* builds (no `Debug`/dev-client builds) so the artifacts are
# representative of what ships — but only the Android one is actually
# store-signed by CD; see the comments on each job below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-web:
    name: Build web (release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Export web build
        run: npm run build:web

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build Android (release APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # android/ is gitignored (Continuous Native Generation) — regenerate
      # it from app.json before building.
      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The RN/Expo template's `release` build type is signingConfig
      # signingConfigs.debug until CD's signing patch is applied, so this
      # produces a debug-keystore-signed release build — correct for
      # smoke-testing/QA installs, not for store submission. CD
      # (.github/workflows/cd.yml) rebuilds and signs with the real
      # upload key behind the play-store approval gate.
      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  build-ios:
    name: Build iOS (release, simulator, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # ios/ is gitignored (Continuous Native Generation) — regenerate it
      # from app.json before building.
      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      # Keyed on the generated Podfile (Podfile.lock doesn't exist pre-`pod
      # install` since ios/ isn't checked in); restore-keys fall back to the
      # newest match.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      # pod install hits CocoaPods' trunk CDN (raw.githubusercontent.com) to
      # resolve podspecs; shared macOS runners occasionally get 429'd there.
      # Retry with backoff before giving up.
      - name: Install CocoaPods dependencies
        working-directory: ios
        run: |
          for attempt in 1 2 3; do
            if pod install; then
              exit 0
            fi
            echo "pod install failed (attempt $attempt/3), retrying after backoff..."
            sleep $((attempt * 30))
          done
          echo "pod install failed after 3 attempts"
          exit 1

      # No distribution certificate is available in CI (and shouldn't be,
      # for PRs from forks), so this can't produce a real .ipa — an .ipa
      # requires device code signing. Build unsigned for the iOS Simulator
      # instead, as a release-configuration smoke test. CD
      # (.github/workflows/cd.yml) produces the actual signed .ipa behind
      # the app-store approval gate.
      - name: Build release app (simulator)
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace Motoryno.xcworkspace \
            -scheme Motoryno \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/ios-sim \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Zip .app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-sim/Build/Products/Release-iphonesimulator/Motoryno.app \
            ios-release-simulator-build.zip

      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-simulator-build
          path: ios-release-simulator-build.zip
          if-no-files-found: error
          retention-days: 14
