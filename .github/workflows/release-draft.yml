name: Draft Release

# Pushing a version tag (e.g. `1.2.3`) creates a draft GitHub Release for
# it, pre-marked as a pre-release — nothing is built or signed here.
# Review/edit the draft (notes, version, etc.), then publish it: that's
# stage 1 of the pipeline, handled by cd.yml (triggers on
# `release: published`, builds/signs the AAB+IPA+web dist, and attaches
# them to this release). Once you're happy with that build, promote the
# release to final by unchecking "Set as a pre-release" and saving — that's
# stage 2, handled by deploy.yml (triggers on `release: released`,
# downloads the artifacts already attached here, and pushes them to the
# stores/CDN). A draft never fires either event, so nothing runs until you
# actually publish it.
on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  draft-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
