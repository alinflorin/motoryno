name: Deploy

# Stage 2 of the release pipeline. cd.yml (stage 1, on `release: published`)
# builds, signs, and attaches the AAB/IPA/web-dist.zip to the GitHub
# Release as assets. This workflow runs when that same release is
# *promoted* from a pre-release to a final release (uncheck "Set as a
# pre-release" on the release and save) — the `released` event fires
# specifically for that transition, not for an ordinary edit (notes,
# title, ...) or for the initial publish-as-pre-release that stage 1
# already handled. It downloads the artifacts stage 1 already built —
# never rebuilds — and pushes them to the stores/CDN.
#
# Needs these repo/org secrets (Settings → Secrets and variables →
# Actions) before it can actually upload anywhere:
#   - CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID          (deploy-web)
#   - PLAY_STORE_SERVICE_ACCOUNT_JSON                      (deploy-android)
#   - APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_ID,
#     APP_STORE_CONNECT_API_KEY                            (deploy-ios)
# and these repo/org variables:
#   - CLOUDFLARE_PAGES_PROJECT_NAME                        (deploy-web)
#   - PLAY_STORE_TRACK, optional, defaults to "internal"   (deploy-android;
#     only applies when triggered by promoting a release — the
#     workflow_dispatch androidTrack input takes priority on manual runs)
on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to deploy from (must already have build artifacts
          attached by cd.yml). Defaults to the promoted release's tag when
          triggered that way; required for a manual run.
        required: false
        type: string
      androidTrack:
        description: 'Play Store track to release the AAB to.'
        required: false
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}

jobs:
  deploy-web:
    name: Deploy web to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download web dist from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'web-dist.zip' --clobber

      - name: Unzip web dist
        run: unzip -o web-dist.zip -d dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main

  deploy-android:
    name: Upload Android AAB to Play Store
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download AAB from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'app-release.aab' --clobber

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.alinflorinciu.motoryno
          releaseFiles: app-release.aab
          track: ${{ github.event.inputs.androidTrack || vars.PLAY_STORE_TRACK || 'internal' }}
          status: completed

  deploy-ios:
    name: Upload iOS IPA to App Store Connect
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --clobber

      # The exported filename comes from the archive's app name (see
      # cd.yml's Export signed IPA step), not a fixed name — resolve it
      # rather than hardcoding.
      - name: Resolve IPA path
        id: ipa
        run: echo "path=$(ls -1 *.ipa | head -n1)" >> "$GITHUB_OUTPUT"

      # Uploads to TestFlight / App Store Connect. Full App Store
      # submission (metadata, screenshots, release notes) is still a
      # manual step in App Store Connect from there.
      - name: Upload to App Store Connect (TestFlight)
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
