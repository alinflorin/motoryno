name: "CodeQL Advanced"

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  schedule:
    # Weekly scan, Monday 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Expo/React Native app code (TS/JS) — pure JS analysis, no build needed.
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest

          # Android native project (Java/Kotlin under android/)
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-latest

          # iOS native project (Swift/Obj-C under ios/) — requires macOS + Xcode.
          - language: swift
            build-mode: manual
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS deps
        uses: ./.github/actions/setup-js

      # javascript-typescript uses build-mode: none (pure static analysis), so
      # CodeQL never actually compiles anything for this leg. Export the web
      # bundle here as a sanity check that web-targeted code still builds.
      - name: Build web app
        if: matrix.language == 'javascript-typescript'
        run: npm run build:web

      # android/ and ios/ are gitignored (Continuous Native Generation) —
      # these composites regenerate them from app.json/app.config (plus JDK/
      # Gradle cache or CocoaPods install as needed) before CodeQL can see or
      # build them. Same composites CI/CD use for their own release builds —
      # prebuild is variant-agnostic, only the build step below differs.
      - name: Prebuild Android project
        if: matrix.language == 'java-kotlin'
        uses: ./.github/actions/prebuild-android

      - name: Prebuild iOS project
        if: matrix.language == 'swift'
        uses: ./.github/actions/prebuild-ios

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # --- Manual build: Android (Gradle) ---
      - name: Build Android app
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon -x lint -x test

      # --- Manual build: iOS (Xcode) ---
      # pod install already ran as part of the prebuild-ios composite above.
      - name: Build iOS app
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace Motoryno.xcworkspace \
            -scheme Motoryno \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
