name: "CodeQL Advanced"

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  schedule:
    # Weekly scan, Monday 03:17 UTC
    - cron: '17 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Expo/React Native app code (TS/JS) — pure JS analysis, no build needed.
          - language: javascript-typescript
            build-mode: none
            os: ubuntu-latest

          # Android native project (Java/Kotlin under android/)
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-latest

          # iOS native project (Swift/Obj-C under ios/) — requires macOS + Xcode.
          - language: swift
            build-mode: manual
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # android/ and ios/ are gitignored (Continuous Native Generation) —
      # regenerate them from app.json/app.config before CodeQL can see or build them.
      - name: Prebuild native Android project
        if: matrix.language == 'java-kotlin'
        run: npx expo prebuild --platform android --no-install

      - name: Prebuild native iOS project
        if: matrix.language == 'swift'
        run: npx expo prebuild --platform ios --no-install

      # --- Gradle cache (java-kotlin only) ---
      # Placed after prebuild since android/ is generated; setup-gradle just needs
      # to run before any ./gradlew invocation to wire up its cache.
      - name: Set up Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@v6

      # --- CocoaPods cache (swift only) ---
      # Keyed on the generated Podfile (Podfile.lock doesn't exist pre-`pod install`
      # since ios/ isn't checked in); restore-keys fall back to the newest match.
      - name: Cache CocoaPods
        if: matrix.language == 'swift'
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # --- Manual build: Android (Gradle) ---
      - name: Build Android app
        if: matrix.language == 'java-kotlin'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon -x lint -x test

      # --- Manual build: iOS (Xcode) ---
      - name: Install CocoaPods dependencies
        if: matrix.language == 'swift'
        working-directory: ios
        run: pod install

      - name: Build iOS app
        if: matrix.language == 'swift'
        working-directory: ios
        run: |
          xcodebuild build \
            -workspace Motoryno.xcworkspace \
            -scheme Motoryno \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
