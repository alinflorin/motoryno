name: CD

# Store-ready, properly signed builds. Triggers on a published GitHub
# Release or a `v*` tag push (either works — use whichever fits your
# release process), plus a manual trigger for re-running a signed build
# without cutting a new release. `published` (not `created`) so draft
# releases don't fire this.
#
# Each job targets a GitHub Environment (play-store / app-store) that
# already has required reviewers configured, so the job pauses for
# approval before touching any signing secrets.
#
# This pipeline builds and signs the AAB/IPA and uploads them as workflow
# artifacts — it does NOT call the Play Store / App Store Connect APIs.
# Upload to the consoles manually (Play Console / Transporter) until
# you're ready to wire up real store credentials.
on:
  release:
    types: [published]
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-android:
    name: Build & sign Android (AAB)
    runs-on: ubuntu-latest
    environment: play-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS deps
        uses: ./.github/actions/setup-js

      - name: Prebuild Android project
        uses: ./.github/actions/prebuild-android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      # android/app/build.gradle is regenerated by `expo prebuild` every
      # run and defaults its `release` build type to the RN template's
      # debug keystore. Patch in a real `release` signingConfig, sourced
      # from env vars (never written to disk), pointing at the keystore
      # decoded above. Fails loudly if the template's known text changes.
      - name: Patch Gradle signing config for release
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = 'android/app/build.gradle';
          let contents = fs.readFileSync(path, 'utf8');

          const signingConfigsBlock = `    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
          }`;
          const signingConfigsWithRelease = `    signingConfigs {
              debug {
                  storeFile file('debug.keystore')
                  storePassword 'android'
                  keyAlias 'androiddebugkey'
                  keyPassword 'android'
              }
              release {
                  storeFile file(System.getenv("MOTORYNO_UPLOAD_STORE_FILE"))
                  storePassword System.getenv("MOTORYNO_UPLOAD_STORE_PASSWORD")
                  keyAlias System.getenv("MOTORYNO_UPLOAD_KEY_ALIAS")
                  keyPassword System.getenv("MOTORYNO_UPLOAD_KEY_PASSWORD")
              }
          }`;

          const releaseSigningLine = `            // Caution! In production, you need to generate your own keystore file.
              // see https://reactnative.dev/docs/signed-apk-android.
              signingConfig signingConfigs.debug`;
          const releaseSigningLinePatched = `            // Caution! In production, you need to generate your own keystore file.
              // see https://reactnative.dev/docs/signed-apk-android.
              signingConfig signingConfigs.release`;

          if (!contents.includes(signingConfigsBlock)) {
            console.error('Expected signingConfigs block not found in build.gradle — Expo/RN template likely changed. Aborting.');
            process.exit(1);
          }
          if (!contents.includes(releaseSigningLine)) {
            console.error('Expected release signingConfig line not found in build.gradle — Expo/RN template likely changed. Aborting.');
            process.exit(1);
          }

          contents = contents.replace(signingConfigsBlock, signingConfigsWithRelease);
          contents = contents.replace(releaseSigningLine, releaseSigningLinePatched);
          fs.writeFileSync(path, contents);
          EOF

      - name: Build signed release AAB
        working-directory: android
        env:
          MOTORYNO_UPLOAD_STORE_FILE: release.keystore
          MOTORYNO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOTORYNO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MOTORYNO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon -x lint -x test

      - name: Remove decoded keystore
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90

  release-ios:
    name: Build & sign iOS (IPA)
    runs-on: macos-latest
    environment: app-store
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JS deps
        uses: ./.github/actions/setup-js

      - name: Prebuild iOS project
        uses: ./.github/actions/prebuild-ios

      # Imports the distribution certificate (.p12) into a temporary,
      # auto-cleaned-up keychain that becomes the default keychain for
      # subsequent codesign/xcodebuild calls.
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/motoryno-appstore.mobileprovision"

      # ios-exportOptions-release.plist ships with a placeholder for the
      # provisioning profile name/UUID (not baked into the repo since it
      # can be rotated without a code change).
      - name: Render export options plist
        env:
          IOS_PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          sed "s/PROVISIONING_PROFILE_SPECIFIER_PLACEHOLDER/$IOS_PROVISIONING_PROFILE_SPECIFIER/" \
            ios-exportOptions-release.plist > ios-exportOptions-release.generated.plist

      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace Motoryno.xcworkspace \
            -scheme Motoryno \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/ios/Motoryno.xcarchive \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/Motoryno.xcarchive \
            -exportPath build/ios \
            -exportOptionsPlist ios-exportOptions-release.generated.plist

      - name: Remove provisioning profile
        if: always()
        run: rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/motoryno-appstore.mobileprovision"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/*.ipa
          if-no-files-found: error
          retention-days: 90
